name: api

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: api

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: magnifit
          POSTGRES_PASSWORD: magnifit
          POSTGRES_DB: magnifit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magnifit -d magnifit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable database: integration tests truncate it.
      TEST_DATABASE_URL: postgres://magnifit:magnifit@localhost:5432/magnifit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
