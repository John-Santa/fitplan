# Render Blueprint for MagniFit (single environment).
# Create it from the dashboard: New > Blueprint > pick this repo (path deploy/render.yaml).
# Secrets use `sync: false`: Render asks for them in the dashboard on first sync.
# NEVER put secret values in this file.
services:
  # Go API. Docker build context is api/ so the image only sees backend code.
  - type: web
    name: magnifit-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /readyz
    # Region alternatives: oregon, ohio, virginia, frankfurt, singapore.
    # Keep it close to the Neon project region to cut query latency.
    region: ohio
    plan: free
    branch: main
    autoDeploy: true
    domains:
      - api.magnifit.co
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: ALLOWED_ORIGINS
        value: https://app.magnifit.co
      # Neon DIRECT connection string (pooling off, host without -pooler): migrations
      # on boot take a session advisory lock the pooled connection does not support.
      # Set in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Clerk production secret key (sk_live_...). Set in the dashboard.
      - key: CLERK_SECRET_KEY
        sync: false
      # Clerk JWT public key (dashboard > API keys > JWKS public key). Optional but
      # recommended: tokens are then verified without calling the Clerk API.
      - key: CLERK_JWT_KEY
        sync: false

  # React PWA, built with Vite and served as a static site.
  - type: web
    name: magnifit-web
    runtime: static
    rootDir: web
    branch: main
    autoDeploy: true
    domains:
      - app.magnifit.co
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    # SPA fallback: every unknown path serves the app shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hashed Vite assets never change for a given URL.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The service worker and shell must always revalidate or updates never ship.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Security headers for every response of the static site.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Enforced: directives that cannot break the app or the Clerk sign-in.
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
      # Full policy in report-only mode: violations show in the browser console
      # and nothing is blocked. Move it into Content-Security-Policy once sign-in
      # and sync run clean in production. The Clerk hosts follow Clerk's CSP guide
      # for a production instance on clerk.magnifit.co.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' https://clerk.magnifit.co https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.clerk.com; connect-src 'self' https://api.magnifit.co https://clerk.magnifit.co https://clerk-telemetry.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE
        value: /
      - key: VITE_API_URL
        value: https://api.magnifit.co
      # Clerk production publishable key (pk_live_...). Public, but set per environment.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
